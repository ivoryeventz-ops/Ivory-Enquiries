<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6e1f2f">
<title>Ivory Enquiries</title>
<style>
  :root{
    --burgundy:#6e1f2f; --burgundy-d:#521622; --gold:#c8a24a; --cream:#faf5ea; --paper:#ffffff;
    --ink:#2a1a1d; --muted:#7a6a6c; --line:#e8dfcd;
    --enq:#4a6a8a; --cost:#b7791f; --blk:#7b5ea7; --conf:#2f7d4f; --other:#8a8a8a; --danger:#a63232;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
  header{position:sticky;top:0;z-index:5;background:var(--burgundy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:3px solid var(--gold)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:#fff}
  .pin .logo{width:84px;height:84px;margin-bottom:14px}
  h1{font-size:19px;margin:0;letter-spacing:.3px;font-weight:650}
  .sub{font-size:12px;opacity:.8;margin-top:2px}
  .icon{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;width:40px;height:40px;font-size:20px}
  .search{margin-top:10px;width:100%;border:0;border-radius:10px;padding:10px 12px;font-size:16px;background:rgba(255,255,255,.95)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px}
  .chip.on{background:var(--burgundy);border-color:var(--burgundy);color:#fff}
  .past{display:flex;align-items:center;gap:8px;padding:6px 16px 0;font-size:13px;color:var(--muted)}
  main{padding:8px 16px calc(100px + env(safe-area-inset-bottom))}
  .count{font-size:12px;color:var(--muted);margin:6px 2px 8px}
  .card{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--other);border-radius:12px;padding:12px 14px;margin-bottom:10px;font:inherit;color:inherit}
  .card.s-Enquiry{border-left-color:var(--enq)} .card.s-Costing{border-left-color:var(--cost)} .card.s-Blocked{border-left-color:var(--blk)} .card.s-Confirmed{border-left-color:var(--conf)}
  .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .name{font-weight:650;font-size:17px}
  .badge{font-size:12px;color:#fff;border-radius:999px;padding:3px 10px;background:var(--other);white-space:nowrap}
  .badge.s-Enquiry{background:var(--enq)} .badge.s-Costing{background:var(--cost)} .badge.s-Blocked{background:var(--blk)} .badge.s-Confirmed{background:var(--conf)}
  .r2{margin-top:4px;font-size:14px}
  .r3{margin-top:2px;font-size:14px;color:var(--muted)}
  .since{margin-top:6px;font-size:12px;color:var(--cost)}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}
  .fabs{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;z-index:6}
  .fab{background:var(--burgundy);color:#fff;border:0;border-radius:999px;padding:15px 20px;font-size:16px;font-weight:600;box-shadow:0 6px 18px rgba(82,22,34,.35);white-space:nowrap}
  .fab.alt{background:#fff;color:var(--burgundy);border:2px solid var(--burgundy);padding:13px 18px}
  .fab span{color:var(--gold);font-size:20px;vertical-align:-1px;margin-right:6px}
  .scrim{position:fixed;inset:0;background:rgba(30,10,14,.5);display:none;z-index:20}
  .scrim.show{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));z-index:21;display:none;max-height:92vh;overflow:auto}
  .sheet.show{display:block}
  .sheet h2{margin:0 0 4px;font-size:19px}
  .sheet .meta{color:var(--muted);font-size:14px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;background:#fff;color:var(--ink)}
  .stbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .st{border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px 8px;font-size:16px;font-weight:600;color:var(--ink)}
  .st.cur{border-color:var(--burgundy);background:#f6e9ec}
  .st.lost{color:var(--danger);grid-column:1 / -1;font-weight:500}
  .primary{width:100%;margin-top:18px;background:var(--burgundy);color:#fff;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:600}
  .primary:disabled{opacity:.6}
  .link{display:block;margin:12px auto 0;background:none;border:0;color:var(--muted);font-size:15px}
  .bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--gold);z-index:50;transition:width .3s}
  .bar.on{width:70%}
  .toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2a1a1d;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;display:none;max-width:88%;text-align:center}
  .toast.err{background:var(--danger)}
  .pin{position:fixed;inset:0;background:var(--cream);z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px}
  .pin.show{display:flex}
  .pin h2{color:var(--burgundy);margin:0 0 6px}
  .pin p{color:var(--muted);margin:0 0 18px;text-align:center}
  .pin input{max-width:260px;text-align:center;letter-spacing:6px;font-size:22px}
  /* quotes sent + outside vendors (inside the detail sheet) */
  .sheet h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .sheet h3 .vcount{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);font-weight:600}
  .note{font-size:14px;color:var(--muted);margin:0 0 10px}
  .note.warn{color:var(--ink);border:1px dashed var(--cost);border-radius:10px;padding:9px 11px}
  .retryb{margin-left:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font-size:14px;color:var(--ink)}
  .qrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;text-decoration:none;color:var(--ink)}
  .qrow b{font-size:16px;font-variant-numeric:tabular-nums}
  .qrow .qs{display:block;font-size:13px;color:var(--muted);margin-top:2px}
  .qrow .go{color:var(--burgundy);font-weight:600;font-size:14px;white-space:nowrap}
  .tag{font-size:11px;background:var(--gold);color:#fff;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle;font-weight:600}
  .vrow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fff}
  .vrow.on{border-color:var(--conf);background:#f0f8f3}
  .vtick{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:600;color:var(--ink);margin:0 0 8px}
  .vtick input{width:24px;height:24px;flex:none;padding:0;accent-color:var(--conf)}
  .vrow textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:16px;min-height:56px;resize:vertical;background:#fff;color:var(--ink)}
  @media(min-width:520px){.vrow{display:grid;grid-template-columns:210px 1fr;gap:10px;align-items:start}.vtick{margin:0;min-height:40px}}
  .vstate{font-size:12px;color:var(--muted);min-height:16px;margin-top:4px}
  .vstate.err{color:var(--danger);font-weight:600}
  details.vmore{margin-top:6px}
  details.vmore summary{font-size:14px;color:var(--burgundy);font-weight:600;padding:6px 0}
  .hbtns{display:flex;gap:8px;align-items:center;flex:0 0 auto}
  .vbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;height:40px;padding:0 14px;font-size:14px;font-weight:600}
  .vfields{display:grid;gap:8px;min-width:0}
  .vfields input{padding:10px 12px}
  .vfilters{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 14px}
  .vfilters label{display:flex;align-items:center;gap:8px;margin:0;font-size:14px;color:var(--ink)}
  .vfilters input{width:auto}
  .vg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .vg h4{margin:0 0 4px;font-size:18px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--burgundy)}
  .vg h4 span{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
  .vi{border-top:1px solid var(--line);padding:9px 0 3px;font-size:15px}
  .vg h4 + .vi{border-top:0}
  .vi .d{font-weight:650}
  .vi .w{color:var(--ink);margin-top:2px}
  .vi .w i{color:var(--muted);font-style:normal}
  .bk{font-size:11px;border-radius:999px;padding:2px 8px;color:#fff;background:var(--conf);margin-left:6px;vertical-align:middle;font-weight:600}
  .bk.no{background:var(--other)}
  .vseg{display:flex;gap:8px;margin:12px 0 0}
  .vchip{flex:1;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 8px;font-size:14px}
  .vchip.on{background:var(--burgundy);border-color:var(--burgundy);color:#fff}
  .vi .vv{color:var(--muted);font-size:13px}
  .wa{display:inline-flex;align-items:center;margin-top:10px;background:#1f9d55;color:#fff;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;text-decoration:none}
  /* Vendor list: "Not assigned" view - every outside-vendor item with no vendor name yet */
  .una{display:grid;grid-template-columns:1fr;gap:6px;border-top:1px solid var(--line);padding:10px 0 4px}
  .vg h4 + .una{border-top:0}
  .una .un{font-weight:650;font-size:15px}
  .una .ud{font-size:13px;color:var(--muted);font-weight:400}
  .una input{padding:10px 12px}
  .una.done{opacity:.55}
  .una.done .un::after{content:" \2713 saved";color:var(--conf);font-size:12px;font-weight:600}
  @media(min-width:520px){.una{grid-template-columns:1fr 1fr;align-items:center}}
</style>
</head>

  <h2>Ivory Enquiries</h2>
  <p id="pinMsg">Enter your PIN</p>
  <form id="pinForm">
    <input id="pinIn" type="password" inputmode="numeric" autocomplete="off">
    <button class="primary" type="submit" style="max-width:260px;display:block;margin:16px auto 0">Open</button>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var pin = '';
  try { pin = localStorage.getItem('ivoryPin') || ''; } catch (e) {}
  var items = [], today = '', filter = 'All', showPast = false, q = '', cur = null, busyN = 0;
  var dTok = 0, vItem = null, VS = {}, vPend = {};

  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (res, rej) {
      var r = google.script.run
        .withSuccessHandler(res)
        .withFailureHandler(function (e) { rej(new Error((e && e.message) || String(e))); });
      r[fn].apply(r, args);
    });
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toDate(iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fmt(iso, short) {
    if (!iso) return 'No date';
    var o = short ? { day: 'numeric', month: 'short' } : { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
    return toDate(iso).toLocaleDateString('en-GB', o);
  }
  function when(iso) {
    if (!iso || !today) return '';
    var d = Math.round((toDate(iso) - toDate(today)) / 86400000);
    if (d === 0) return 'today';
    if (d === 1) return 'tomorrow';
    if (d > 1) return 'in ' + d + ' days';
    return Math.abs(d) + ' days ago';
  }
  function busy(on) {
    busyN += on ? 1 : -1;
    $('#bar').classList.toggle('on', busyN > 0);
  }
  var tt;
  function toast(msg, err) {
    var t = $('#toast');
    t.textContent = msg;
    t.className = 'toast' + (err ? ' err' : '');
    t.style.display = 'block';
    clearTimeout(tt);
    tt = setTimeout(function () { t.style.display = 'none'; }, 3200);
  }

  function render() {
    var ql = q.trim().toLowerCase();
    var list = items.filter(function (i) {
      if (!showPast && i.date && i.date < today) return false;
      if (filter !== 'All' && i.status !== filter) return false;
      if (ql && (i.name + ' ' + i.venue).toLowerCase().indexOf(ql) < 0) return false;
      return true;
    });
    $('#sub').textContent = list.length + ' shown';
    $('#count').textContent = showPast ? 'Oldest first' : 'Upcoming events, soonest first';
    if (!list.length) {
      $('#list').innerHTML = '<div class="empty">Nothing here yet.</div>';
      return;
    }
    $('#list').innerHTML = list.map(function (i) {
      var sc = 's-' + esc(i.status);
      return '<button class="card ' + sc + '" data-row="' + i.row + '">' +
        '<div class="r1"><span class="name">' + esc(i.name) + '</span><span class="badge ' + sc + '">' + esc(i.status) + '</span></div>' +
        '<div class="r2">' + fmt(i.date) + ' &middot; ' + when(i.date) + '</div>' +
        '<div class="r3">' + esc(i.venue) + '</div>' +
        (i.status === 'Costing' && i.since ? '<div class="since">Costing since ' + fmt(i.since, true) + ' &middot; reminder every 2 days</div>' : '') +
        '</button>';
    }).join('');
  }

  function showPin(msg) {

  /* ---------- quotes sent + outside vendors ---------- */
  var GH_REPO = 'ivoryeventz-ops/Ivory-Packages', GH_BRANCH = 'main', GH_SITE = 'https://ivory-packages.pages.dev';
  // The 12 standard outside vendors (same list as VENDOR_NAMES in Code.gs).
  var VNAMES = ['Garland and Bouquet', 'Wedding cake', 'Confetti', 'Cold Spark', 'Dry Ice', 'Ambiance lighting',
    'Parking Security', 'Live Band', 'Wedding Car', 'Generator', 'Pagoda', 'Table & Chair covers'];
  // Wording used to pick a work's vendors out of its latest quote page. Vendor names themselves come from the sheet side.
  var VENDOR_RE = {
    'Garland and Bouquet': /garland|bouquet/i,
    'Wedding cake': /\bcake\b(?!\s*cutting)/i,
    'Confetti': /confetti/i,
    'Cold Spark': /spark/i,
    'Dry Ice': /dry\s*ice|\bfog\b/i,

  var MONTHS = { january: 1, february: 2, march: 3, april: 4, may: 5, june: 6, july: 7, august: 8, september: 9, october: 10, november: 11, december: 12 };
  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  var ghTree = null, ghTreeAt = 0, ghCache = {};

      .then(function (j) {
        var t = {};

  function ghQuote(folder, no) {
    var k = folder + '/' + no;

    ghCache[k] = fetch('https://raw.githubusercontent.com/' + GH_REPO + '/' + GH_BRANCH + '/' + encodeURIComponent(folder) + '/' + no + '.html')
      .then(function (r) { if (!r.ok) throw new Error('quote ' + no + ' not readable'); return r.text(); })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, 'text/html'), date = null, venue = '';
        Array.prototype.forEach.call(doc.querySelectorAll('.info-item'), function (it) {
          var l = ((it.querySelector('.info-label') || {}).textContent || '').trim().toLowerCase();
          var v = ((it.querySelector('.info-value') || {}).textContent || '').trim();
          if (l === 'date') date = isoFromText(v);
          if (l === 'venue') venue = v;
        });
        var outside = [];   // items the quote itself lists under "Outside Vendors"
        Array.prototype.forEach.call(doc.querySelectorAll('.section-card'), function (sc) {
          if (!/outside\s*vendors/i.test((sc.querySelector('.section-title') || {}).textContent || '')) return;
          Array.prototype.forEach.call(sc.querySelectorAll('.line-item-name'), function (n) {
            var nm = (n.textContent || '').replace(/\s+/g, ' ').trim();

        });
        Array.prototype.forEach.call(doc.querySelectorAll('script,style'), function (n) { n.parentNode.removeChild(n); });
        var text = ((doc.body && doc.body.textContent) || '').replace(/\s+/g, ' ');
        var cut = text.search(/Complimentary Wedding Management/i);   // the free services are not outside vendors
        if (cut > 0) text = text.slice(0, cut);
        return { no: no, src: 'cloud', url: GH_SITE + '/' + encodeURIComponent(folder) + '/' + no, date: date, venue: venue, text: text, outside: outside };
      })
      .catch(function (e) { delete ghCache[k]; throw e; });
    return ghCache[k];
  }
  // Newer quote pages (ivory-packages.pages.dev). Two clients can share a first name, so a quote written for another event date is dropped.
  function ghQuotes(it) {
    return ghTreeGet().then(function (tree) {

      var jobs = [];
      Object.keys(tree).forEach(function (f) {
        var fn = ' ' + f.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim() + ' ';
        if (full.indexOf(fn) < 0) return;
        tree[f].forEach(function (no) { jobs.push(ghQuote(f, no).then(function (q) { return q; }, function () { return null; })); });
      });
      return Promise.all(jobs);
    }).then(function (all) {
      return all.filter(function (q) { return q && (!q.date || q.date === it.date); });
    });
  }

  function vSaved(name) { var s = VS[name]; return !!(s && (s.booked || (s.supplier || '').trim() || (s.details || '').trim())); }

  // Message for one vendor: "Date: venue" then each item name followed by its Details exactly as typed. No client name, no greeting.

  function quoteVendors(latest) {

    var works = items.filter(function (i) { return i.status === 'Confirmed' && (past || !i.date || i.date >= today); });
    works.sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });
    $('#vlList').innerHTML = '<div class="note">Checking the quotes of ' + works.length + ' confirmed works...</div>';
    return Promise.all(works.map(function (it) {
      return ghQuotes(it).then(function (qs) { return { it: it, qs: qs }; }, function () { return { it: it, qs: [], err: true }; });
    })).then(function (res) {
      if (tok !== unaTok) return;
      var named = {}, saved = {};
      VL.forEach(function (r) {
        var k = r.id + '|' + r.date + '|' + r.vendor;
        saved[k] = r;
        if ((r.supplier || '').trim()) named[k] = 1;
      });
      var groups = [], unreadable = [], failed = false;
      res.forEach(function (x) {
        var it = x.it, base = it.id + '|' + it.date + '|';
        var qs = x.qs.slice().sort(function (a, b) { return b.no.localeCompare(a.no); });   // latest quote first
        var names = quoteVendors(qs[0]);
        VL.forEach(function (r) {   // anything already saved for this work, even if the quote no longer lists it
          if (r.id === it.id && r.date === it.date && names.indexOf(r.vendor) < 0) names.push(r.vendor);
        });
        if (x.err) failed = true;
        if (!qs.length && !names.length) { unreadable.push(it.name); return; }
        var lines = names.filter(function (n) {
          var k = base + n, s = saved[k];
          if (named[k]) return false;                                      // already has a vendor name
          if (s && /included\s+in\s+package/i.test(s.details || '')) return false;   // supplied inside the package
          return true;
        });
        if (lines.length) groups.push({ it: it, lines: lines, saved: saved, base: base });
      });
      UNA = { groups: groups, unreadable: unreadable, failed: failed };
      renderUna();
    }).catch(function (e) {
      if (tok !== unaTok) return;
      $('#vlList').innerHTML = '<div class="note warn">Could not check the quotes (' + esc(e.message) + ').<button class="retryb" id="vlRetry">Try again</button></div>';
    });
  }
  var UNA = null;
  function renderUna() {
    if (!UNA) { unaCompute(); return; }
    var ql = ($('#vlQ').value || '').trim().toLowerCase(), total = 0, h = '';
    UNA.groups.forEach(function (g) {
      var it = g.it;
      if (ql && (it.name + ' ' + it.venue + ' ' + g.lines.join(' ')).toLowerCase().indexOf(ql) < 0) return;
      total += g.lines.length;
      h += '<div class="vg"><h4>' + esc(it.name) + '<span>' + fmt(it.date) + '</span></h4>' +
        (it.venue ? '<div class="vv" style="font-size:13px;color:var(--muted);margin-bottom:2px">' + esc(it.venue) + '</div>' : '') +
        g.lines.map(function (n) {
          var s = g.saved[g.base + n], det = s && (s.details || '').trim();
          return '<div class="una" data-row="' + it.row + '" data-id="' + esc(it.id) + '" data-date="' + esc(it.date) + '" data-v="' + esc(n) + '">' +
            '<div class="un">' + esc(n) + (det ? '<div class="ud">' + esc(det) + '</div>' : '') + '</div>' +
            '<input class="uname" list="unaSup" autocomplete="off" placeholder="Vendor name" aria-label="' + esc(n) + ' - vendor name"></div>';
        }).join('') + '</div>';
    });
    var sup = {}, supList = [];
    VL.forEach(function (r) { var s = (r.supplier || '').trim(); if (s && !sup[s.toLowerCase()]) { sup[s.toLowerCase()] = 1; supList.push(s); } });
    supList.sort(function (a, b) { return a.toLowerCase().localeCompare(b.toLowerCase()); });
    var head = '<div class="note"><b>' + total + '</b> outside-vendor ' + (total === 1 ? 'item has' : 'items have') + ' no vendor name yet. Type the name next to an item and it saves straight away.</div>';
    if (!total) head = '<div class="note">' + (UNA.groups.length ? 'Nothing matches.' : 'Every outside vendor has a name. Nothing left to assign.') + '</div>';
    h = head + h + '<datalist id="unaSup">' + supList.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>';
    if (UNA.unreadable.length) h += '<div class="note warn">No readable quote for ' + esc(UNA.unreadable.join(', ')) + ', so their vendors are not listed. Open the work to check.</div>';
    if (UNA.failed) h += '<div class="note warn">Some quotes could not be loaded just now.<button class="retryb" id="vlRetry">Try again</button></div>';
    $('#vlList').innerHTML = h;
  }
  $('#vlList').addEventListener('change', function (e) {
    var inp = e.target.closest('.uname'); if (!inp) return;
    var row = inp.closest('.una'), val = inp.value.trim(); if (!val) return;
    var d = { row: +row.getAttribute('data-row'), id: row.getAttribute('data-id'), date: row.getAttribute('data-date'), vendor: row.getAttribute('data-v') };
    busy(true);
    call('api_vendor', pin, { row: d.row, id: d.id, date: d.date, vendor: d.vendor, fields: { supplier: val } })
      .then(function () {
        row.classList.add('done');
        var hit = VL.filter(function (r) { return r.id === d.id && r.date === d.date && r.vendor === d.vendor; })[0];
        if (hit) hit.supplier = val;
        else {
          var it = items.filter(function (i) { return i.row === d.row; })[0] || {};
          VL.push({ id: d.id, date: d.date, client: it.name || '', venue: it.venue || '', vendor: d.vendor, details: '', supplier: val, booked: false });
        }
      })
      .catch(function (err) { toast('Not saved: ' + err.message, true); })
      .then(function () { busy(false); });
  });

  $('#vlist').addEventListener('click', function () { UNA = null; openVL(); });
  $('#vlClose').addEventListener('click', closeSheets);
  $('#vlView').addEventListener('click', function (e) {
    var b = e.target.closest('.vchip'); if (!b) return;
    vlView = b.getAttribute('data-view');
    if (vlView === 'una') UNA = null;   // recheck so names just entered are reflected
    renderVL();
  });
  $('#vlSeg').addEventListener('click', function (e) {
    var b = e.target.closest('.vchip'); if (!b) return;
    vlF = b.getAttribute('data-b');
    Array.prototype.forEach.call(document.querySelectorAll('#vlSeg .vchip'), function (x) { x.classList.toggle('on', x === b); });
    renderVL();
  });
  $('#vlPast').addEventListener('change', function () { UNA = null; renderVL(); });
  $('#vlQ').addEventListener('input', renderVL);
  $('#vlList').addEventListener('click', function (e) { if (e.target.id === 'vlRetry') { UNA = null; if (vlView === 'una') renderVL(); else openVL(); } });

  // keep both phones current
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(true); });
  setInterval(function () { if (!document.hidden && !document.querySelector('.sheet.show')) load(true); }, 60000);

  load();
})();
</script>
</body>
