<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6e1f2f">
<title>Ivory Enquiries</title>
<style>
  :root{
    --burgundy:#6e1f2f; --burgundy-d:#521622; --gold:#c8a24a; --cream:#faf5ea; --paper:#ffffff;
    --ink:#2a1a1d; --muted:#7a6a6c; --line:#e8dfcd;
    --enq:#4a6a8a; --cost:#b7791f; --blk:#7b5ea7; --conf:#2f7d4f; --other:#8a8a8a; --danger:#a63232;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
  header{position:sticky;top:0;z-index:5;background:var(--burgundy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:3px solid var(--gold)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:#fff}
  .pin .logo{width:84px;height:84px;margin-bottom:14px}
  h1{font-size:19px;margin:0;letter-spacing:.3px;font-weight:650}
  .sub{font-size:12px;opacity:.8;margin-top:2px}
  .icon{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;width:40px;height:40px;font-size:20px}
  .search{margin-top:10px;width:100%;border:0;border-radius:10px;padding:10px 12px;font-size:16px;background:rgba(255,255,255,.95)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px}
  .chip.on{background:var(--burgundy);border-color:var(--burgundy);color:#fff}
  .past{display:flex;align-items:center;gap:8px;padding:6px 16px 0;font-size:13px;color:var(--muted)}
  main{padding:8px 16px calc(100px + env(safe-area-inset-bottom))}
  .count{font-size:12px;color:var(--muted);margin:6px 2px 8px}
  .card{cursor:pointer;display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--other);border-radius:12px;padding:12px 14px;margin-bottom:10px;font:inherit;color:inherit}
  .card.s-Enquiry{border-left-color:var(--enq)} .card.s-Costing{border-left-color:var(--cost)} .card.s-Blocked{border-left-color:var(--blk)} .card.s-Confirmed{border-left-color:var(--conf)}
  .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .name{font-weight:650;font-size:17px}
  .badge{font-size:12px;color:#fff;border-radius:999px;padding:3px 10px;background:var(--other);white-space:nowrap}
  .badge.s-Enquiry{background:var(--enq)} .badge.s-Costing{background:var(--cost)} .badge.s-Blocked{background:var(--blk)} .badge.s-Confirmed{background:var(--conf)}
  .r2{margin-top:4px;font-size:14px}
  .r3{margin-top:2px;font-size:14px;color:var(--muted)}
  .since{margin-top:6px;font-size:12px;color:var(--cost)}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}
  .fabs{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;z-index:6}
  .fab{background:var(--burgundy);color:#fff;border:0;border-radius:999px;padding:15px 20px;font-size:16px;font-weight:600;box-shadow:0 6px 18px rgba(82,22,34,.35);white-space:nowrap}
  .fab.alt{background:#fff;color:var(--burgundy);border:2px solid var(--burgundy);padding:13px 18px}
  .fab span{color:var(--gold);font-size:20px;vertical-align:-1px;margin-right:6px}
  .scrim{position:fixed;inset:0;background:rgba(30,10,14,.5);display:none;z-index:20}
  .scrim.show{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));z-index:21;display:none;max-height:92vh;overflow:auto}
  .sheet.show{display:block}
  .sheet h2{margin:0 0 4px;font-size:19px}
  .sheet .meta{color:var(--muted);font-size:14px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;background:#fff;color:var(--ink)}
  .stbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .st{border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px 8px;font-size:16px;font-weight:600;color:var(--ink)}
  .st.cur{border-color:var(--burgundy);background:#f6e9ec}
  .st.lost{color:var(--danger);grid-column:1 / -1;font-weight:500}
  .primary{width:100%;margin-top:18px;background:var(--burgundy);color:#fff;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:600}
  .primary:disabled{opacity:.6}
  .link{display:block;margin:12px auto 0;background:none;border:0;color:var(--muted);font-size:15px}
  .bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--gold);z-index:50;transition:width .3s}
  .bar.on{width:70%}
  .toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2a1a1d;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;display:none;max-width:88%;text-align:center}
  .toast.err{background:var(--danger)}
  .pin{position:fixed;inset:0;background:var(--cream);z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px}
  .pin.show{display:flex}
  .pin h2{color:var(--burgundy);margin:0 0 6px}
  .pin p{color:var(--muted);margin:0 0 18px;text-align:center}
  .pin input{max-width:260px;text-align:center;letter-spacing:6px;font-size:22px}
  /* quotes sent + outside vendors (inside the detail sheet) */
  .sheet h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .sheet h3 .vcount{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);font-weight:600}
  .note{font-size:14px;color:var(--muted);margin:0 0 10px}
  .note.warn{color:var(--ink);border:1px dashed var(--cost);border-radius:10px;padding:9px 11px}
  .retryb{margin-left:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font-size:14px;color:var(--ink)}
  .qrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;text-decoration:none;color:var(--ink)}
  .qrow b{font-size:16px;font-variant-numeric:tabular-nums}
  .qrow .qs{display:block;font-size:13px;color:var(--muted);margin-top:2px}
  .qrow .go{color:var(--burgundy);font-weight:600;font-size:14px;white-space:nowrap}
  .tag{font-size:11px;background:var(--gold);color:#fff;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle;font-weight:600}
  .vrow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fff}
  .vrow.on{border-color:var(--conf);background:#f0f8f3}
  .vtick{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:600;color:var(--ink);margin:0 0 8px}
  .vtick input{width:24px;height:24px;flex:none;padding:0;accent-color:var(--conf)}
  .vrow textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:16px;min-height:56px;resize:vertical;background:#fff;color:var(--ink)}
  @media(min-width:520px){.vrow{display:grid;grid-template-columns:210px 1fr;gap:10px;align-items:start}.vtick{margin:0;min-height:40px}}
  .vstate{font-size:12px;color:var(--muted);min-height:16px;margin-top:4px}
  .vstate.err{color:var(--danger);font-weight:600}
  details.vmore{margin-top:6px}
  details.vmore summary{font-size:14px;color:var(--burgundy);font-weight:600;padding:6px 0}
  .hbtns{display:flex;gap:8px;align-items:center;flex:0 0 auto}
  .vbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;height:40px;padding:0 14px;font-size:14px;font-weight:600}
  .vfields{display:grid;gap:8px;min-width:0}
  .vfields input{padding:10px 12px}
  .vfilters{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 14px}
  .vfilters label{display:flex;align-items:center;gap:8px;margin:0;font-size:14px;color:var(--ink)}
  .vfilters input{width:auto}
  .vg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .vg h4{margin:0 0 4px;font-size:18px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--burgundy)}
  .vg h4 span{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
  .vi{border-top:1px solid var(--line);padding:9px 0 3px;font-size:15px}
  .vg h4 + .vi{border-top:0}
  .vi .d{font-weight:650}
  .vi .w{color:var(--ink);margin-top:2px}
  .vi .w i{color:var(--muted);font-style:normal}
  .bk{font-size:11px;border-radius:999px;padding:2px 8px;color:#fff;background:var(--conf);margin-left:6px;vertical-align:middle;font-weight:600}
  .bk.no{background:var(--other)}
  .vseg{display:flex;gap:8px;margin:12px 0 0}
  .vchip{flex:1;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 8px;font-size:14px}
  .vchip.on{background:var(--burgundy);border-color:var(--burgundy);color:#fff}
  .vi .vv{color:var(--muted);font-size:13px}
  .wa{display:inline-flex;align-items:center;margin-top:10px;background:#1f9d55;color:#fff;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;text-decoration:none}
  .vtk{display:inline-flex;align-items:center;gap:10px;margin:6px 0 2px;padding:7px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-weight:600;color:var(--ink);background:var(--bg,#faf5ea)}
  .vtk input{width:22px;height:22px;padding:0;flex:none;accent-color:var(--conf)}
  .vtk.on{border-color:var(--conf);background:#f0f8f3;color:var(--conf)}
  .nq{margin-top:6px;font-size:13px;font-weight:700;color:var(--danger)}
  .mg{margin-top:6px;font-size:13px;font-weight:600;color:var(--cost)}
  .acts{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
  .acts .sg{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--cost);margin:6px 0 2px;display:flex;gap:8px;flex-wrap:wrap}
  .acts .sg em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted)}
  .acts .sg em.late{color:var(--danger)}
  .acts .sg.later{color:var(--muted)}
  .act{display:flex;align-items:flex-start;gap:10px;margin:2px 0;padding:6px 0;font-size:15px;color:var(--ink)}
  .act input{width:22px;height:22px;padding:0;flex:none;accent-color:var(--conf);margin-top:1px}
  .act.done span{text-decoration:line-through;color:var(--muted)}
  #dActs h3{margin-top:22px}
  /* Vendor list: "Not assigned" view - every outside-vendor item with no vendor name yet */
  .una{display:grid;grid-template-columns:1fr;gap:6px;border-top:1px solid var(--line);padding:10px 0 4px}
  .vg h4 + .una{border-top:0}
  .una .un{font-weight:650;font-size:15px}
  .una .ud{font-size:13px;color:var(--muted);font-weight:400}
  .una input{padding:10px 12px}
  .una.done{opacity:.55}
  .una.done .un::after{content:" \2713 saved";color:var(--conf);font-size:12px;font-weight:600}
  @media(min-width:520px){.una{grid-template-columns:1fr 1fr;align-items:center}}

  /* payment details sheet */
  .payrow{width:100%;text-align:left;font:inherit;cursor:pointer;border-color:var(--gold);background:#fffaf0}
  .payrow b{font-size:16px}
  #pay h4{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 0 8px}
  .prow{display:grid;grid-template-columns:1fr 112px 34px;gap:6px;margin-bottom:8px;align-items:center}
  .prow.two{grid-template-columns:1fr 112px}
  .prow input{padding:10px 10px;font-size:15px}
  .prow .amt{text-align:right;font-variant-numeric:tabular-nums}
  .prow .x{border:1px solid var(--line);background:#fff;border-radius:8px;height:40px;font-size:18px;color:var(--danger)}
  .plab{font-size:15px;font-weight:600}
  .psum{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:15px}
  .psum div{display:flex;justify-content:space-between;padding:3px 0}
  .psum .bal{border-top:1px solid var(--line);margin-top:4px;padding-top:7px;font-weight:700;color:var(--burgundy);font-size:17px}
  .pbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;color:var(--burgundy);margin:2px 6px 0 0}
  .pst{font-size:13px;min-height:18px;margin-top:8px;color:var(--muted)}
  .pst.err{color:var(--danger);font-weight:600}

  /* wedding timeline sheet */
  #tl h4{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 0 8px}
  #tl textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;background:#fff;color:var(--ink);resize:vertical}
  .tl2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tlcar{border:1px solid var(--line);border-radius:12px;padding:6px 12px 12px;margin:10px 0;background:#fff}
  .tlch{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
  .tlch .x{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;font-size:18px;color:var(--danger)}
  .tlchk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px;margin-top:12px}
  #tlPrev{display:none;width:100%;height:70vh;border:1px solid var(--line);border-radius:12px;margin-top:10px;background:#fff}

  /* edit as new quote */
  .qwrap{display:flex;gap:6px;margin-bottom:8px;align-items:stretch}
  .qwrap .qrow{flex:1;margin-bottom:0;min-width:0}
  .qedit{flex:0 0 auto;width:92px;border:1px solid var(--gold);background:#fffaf0;border-radius:12px;font:inherit;font-size:13px;font-weight:600;color:var(--burgundy);padding:6px}
  #qe h4{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 0 8px}
  #qe textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;background:#fff;color:var(--ink);resize:vertical}
  #qe input,#qe select{padding:10px 10px;font-size:15px}
  .qdt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .qtaken{background:#fff4e0;border:1px solid var(--cost);border-radius:10px;padding:2px 10px 8px;margin-top:8px}
  .qtaken input{width:auto}
  .qsec{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 10px 12px;margin:12px 0}
  .qsec h4{margin-top:4px}
  .qhint{text-transform:none;letter-spacing:0;font-weight:400;font-size:12px;margin-left:4px}
  .qsh,.qlh,.qtot{display:grid;gap:6px;align-items:center;margin-bottom:8px}
  .qsh{grid-template-columns:1fr 34px 34px 34px}
  .qlh{grid-template-columns:1fr 34px 34px 34px}
  .qtot{grid-template-columns:1fr 110px 34px}
  .qtot .amt{text-align:right;font-variant-numeric:tabular-nums}
  #qe .x{border:1px solid var(--line);background:#fff;border-radius:8px;height:38px;font-size:17px;color:var(--ink);padding:0}
  #qe .x.del{color:var(--danger);font-size:19px}
  .qlab{font-size:12px;color:var(--muted);margin:6px 0 4px}
  .qline{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
  .qnum{display:grid;grid-template-columns:1fr 90px auto;gap:8px;align-items:end;margin:2px 0 6px}
  .qnum label{margin:0;font-size:12px}
  .qamt{font-weight:700;color:var(--burgundy);padding-bottom:10px;text-align:right;min-width:72px;font-variant-numeric:tabular-nums}
  .qshown{font-size:12px;color:var(--cost);margin:0 0 6px;min-height:0}
  .qshown:empty{display:none}
  .qline input[data-f=note]{margin-top:6px}
  .qbtns{margin-top:10px}
  .qsum{font-size:13px;color:var(--muted);margin-top:12px}
  .qcat{border:1px solid var(--gold);background:#fffaf0;border-radius:12px;padding:10px;margin:10px 0}
  .qcat-top{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end;margin-bottom:8px}
  .qcat-top .qlab{margin:0}
  .qcl{max-height:46vh;overflow:auto}
  .qcg{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:12px 0 4px}
  .qci{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;font:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;color:var(--ink)}
  .qci small{display:block;font-size:12px;color:var(--muted);margin-top:2px;font-weight:400}
  .qci b{white-space:nowrap;color:var(--burgundy);font-size:14px}
  .qcat-top{grid-template-columns:1fr}
  .qtotbox{margin-top:14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .qtotbox input[type=text],.qtotbox #qeTotLabel{margin-top:8px}
  .qgh{display:flex;justify-content:space-between;align-items:center;width:100%;font:inherit;font-weight:600;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:6px;color:var(--ink);text-align:left}
  .qgh.on{border-color:var(--gold);background:#fffaf0}
  .qgh em{font-style:normal;font-weight:600;font-size:12px;color:var(--burgundy);margin-right:8px}
  .qci{align-items:center}
  .qci.on{border-color:var(--burgundy);background:#fff6f6}
  .qtick{flex:0 0 22px;height:22px;border:2px solid var(--line);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;color:#fff;background:#fff}
  .qci.on .qtick{background:var(--burgundy);border-color:var(--burgundy)}
  .qci>span:nth-child(2){flex:1}
  .qstg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .qstg button{flex:0 0 auto;border:2px solid var(--line);border-radius:8px;padding:0;background:#fff;width:96px;height:72px;overflow:hidden}
  .qstg img{width:100%;height:100%;object-fit:cover;display:block}
  #qePrev{display:none;width:100%;height:70vh;border:1px solid var(--line);border-radius:12px;margin-top:10px;background:#fff}
</style>
</head>
<body>
<div class="bar" id="bar"></div>

<header>

<script type="text/plain" id="qeCss">
    :root {
      --primary-gold: #c5a059;
      --gold-dark: #9e7b39;
      --charcoal: #222222;
      --text-muted: #555555;
      --card-bg: #ffffff;
      --page-bg: #fdfbf7;
      --border-color: #ebdcc4;
      --subtle-bg: #faf7f2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { background-color: var(--page-bg); -webkit-text-size-adjust: 100%; }

    body {
      background-color: var(--page-bg);
      font-family: 'Montserrat', sans-serif;
      color: var(--charcoal);
      line-height: 1.5;
      padding: 12px;
      margin: 0;
    }

    .container { max-width: 860px; margin: 0 auto; padding-bottom: 24px; }

    .header-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px 16px;
      text-align: center;
      margin-bottom: 14px;
    }

    .brand-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .sub-title {
      font-size: 0.82rem;
      color: var(--primary-gold);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      text-align: left;
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
    }

    .info-item {
      background: var(--subtle-bg);
      padding: 10px 14px;
      border-radius: 6px;
      border-left: 3px solid var(--primary-gold);
    }

    .info-label { font-size: 0.68rem; text-transform: uppercase; font-weight: 600; color: #777; }
    .info-value { font-size: 0.92rem; font-weight: 600; color: var(--charcoal); }

    .image-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .image-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--charcoal);
    }

    .image-wrapper {
      width: 100%;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #eee;
    }

    .image-wrapper img { width: 100%; height: auto; display: block; }

    .timeline-title {
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--gold-dark);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    .timeline-title:first-of-type { margin-top: 0; }

    .services-intro {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: var(--gold-dark);
      margin-bottom: 12px;
    }

    .item-list li strong { font-weight: 600; color: var(--charcoal); }

    .sub-bullets { list-style: none; margin-top: 4px; }

    /* Container has pointer-events: none so it NEVER intercepts page swipes on iPhone */

      position: fixed;
      right: 14px;

      display: flex;
      flex-direction: column;

    .quick-nav-pill {
      pointer-events: auto;
      background: #FFFFFF;
      border: 1.5px solid var(--gold-primary);
      box-shadow: 0 6px 22px rgba(45, 41, 38, 0.16);

      display: flex;
      align-items: center;
      padding: 4px 6px;

    .q-btn {
      background: transparent;
      border: none;
      color: var(--gold-deep);
      font-size: 12px;
      font-weight: 700;

      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: inherit;

    .q-btn:active {

    .q-btn-icon {

<body>

    <h1>${A.names}</h1>

  </section>

  <main class="container">

    <\!-- Key Timings Summary Card -->
    <section class="summary-card" id="sec-summary">
      <span class="tagline">At A Glance</span>
      <h2>Key Timings</h2>
      <div class="timing-grid">
        <div class="timing-box">

    <\!-- Phase 1: The Day Before & Morning Prep -->
    <div class="phase-header" id="sec-phase-1">
      <h2>1. The Day Before &amp; Morning Prep</h2>
    </div>

    <article class="card">
      <span class="tagline">The Day Before</span>
      <h3>Reception Venue Setup</h3>
      <p>Our team will reach the reception venue in the afternoon or evening before the wedding, depending on when the venue opens up, other activities taking place there, and the setup required.</p>
      <ul class="bullet-list">
        <li>Stage décor and other arrangements begin as soon as venue access is available.</li>
        <li>Flowers, lighting, and final details are completed towards the end of the setup.</li>
        <li>The entire venue will be ready at least 30 minutes before the reception begins.</li>
      </ul>
    </article>

    <article class="card">
      <span class="tagline">Wedding Morning</span>
      <h3>Car Décor &amp; Things to Keep Ready</h3>
      ${A.carParas}

      <p style="margin-top: 1.25rem; font-weight: 600;">Before leaving for church, please keep these items together and ready:</p>
      <ul class="essentials-list">
        <li>Manthrakodi</li>
        <li>Minnu</li>
        <li>Wedding Rings</li>
        <li>${A.vaazh}</li>
      </ul>

      <div class="friendly-tip">
        <strong>Helpful Tip for the Manthrakodi &amp; Minnu</strong>
        To stop the Manthrakodi from unfolding during the ceremony, tie its four corners lightly with a small thread. Traditionally, the Minnu is prepared using threads taken from the Manthrakodi, bonded with cooked rice. Many families now prefer a glue stick, which is cleaner and easier.
      </div>
    </article>

    <\!-- Phase 2: Reaching the Church & The Service -->
    <div class="phase-header" id="sec-phase-2">
      <h2>2. Reaching the Church &amp; The Service</h2>
    </div>

    <article class="card">
      <span class="tagline">Timing</span>
      <h3>Arrive Early, Stay Relaxed</h3>
      <p>We recommend that the bride and groom reach the church at least 30 minutes before the service. This gives the photographers enough time for:</p>
      <ul class="bullet-list">
        <li>Arrival photographs</li>
        <li>Wedding-car photographs</li>
        <li>Couple portraits</li>
        <li>Family photographs</li>
        <li>A few relaxed moments before the service</li>
      </ul>
      <div class="friendly-tip">
        <strong>No Need to Rush Inside</strong>
        There is no need to walk into the church immediately after arriving. Allow time for photographs and family coordination, and let the procession begin at a comfortable pace. It helps if the bride’s family follows a similar timeline, so that both the bride and groom are seated at least 5 minutes before the service begins.
      </div>
    </article>

    <article class="card">
      <span class="tagline">Preparing for the Procession</span>
      <h3>Handing Over the Wedding Items</h3>
      <p>Once you reach the church, please make sure the following are ready:</p>

      <div class="procession-wrap">
        <div class="procession-side">
          <span class="procession-subtext">Basket</span>
          <h4>Manthrakodi Basket</h4>
          <ol>
            <li>Manthrakodi</li>
            <li>Minnu</li>
            <li>${A.vaazhBasket}</li>
          </ol>
        </div>
        <div class="procession-side">
          <span class="procession-subtext">Box</span>
          <h4>Ring Bearer Box</h4>
          <ol>
            <li>Bride’s wedding ring</li>
            <li>Groom’s wedding ring</li>
          </ol>
        </div>
      </div>

      <p style="margin-top: 1.1rem;">The items may be carried by one person or shared between two people.</p>
      <ul class="bullet-list">
        <li>Please hand over the Manthrakodi basket and ring box to the sexton at least 5 minutes before the procession begins.</li>
        <li>The sexton will place the items on the designated table near the altar.</li>
        <li>Once the items are placed, our team will collect the basket and ring box and coordinate them for the procession.</li>
      </ul>

      <div class="friendly-tip">
        <strong>Family Tradition</strong>
        Traditionally, the Manthrakodi is carried to the altar by a close female relative of the groom, such as a sister, cousin, or aunt.
      </div>
    </article>

    <article class="card">
      <span class="tagline">Walking In</span>
      <h3>The Procession</h3>
      <p>The exact order can vary slightly from church to church. A typical ${A.church} procession follows this order:</p>

      <div class="procession-wrap">${A.procession}</div>

      <p class="fine-print">
        Bridesmaids and groomsmen may enter individually or in pairs, depending on your preference and the church’s practice.
      </p>${A.vicarTip}
    </article>

    <article class="card">
      <span class="tagline">The Service</span>
      <h3>The Wedding Ceremony</h3>
      <p>The wedding service will proceed according to the church’s customs and schedule.</p>
    </article>

    <\!-- Phase 3: After the Service -->
    <div class="phase-header" id="sec-phase-3">
      <h2>3. After the Service</h2>
    </div>

    <article class="card">
      <span class="tagline">Formalities</span>
      <h3>Signing the Register &amp; Church Photographs</h3>
      <p>The service is usually followed by a few formalities:</p>
      <ul class="bullet-list">
        <li>Signing the register</li>
        <li>Offertory</li>
        <li>Photographs with the bishop and priests</li>
      </ul>
      <p style="margin-top: 0.9rem;">Please allow approximately <strong>30 to 45 minutes</strong> for these formalities.</p>
    </article>

    <article class="card">
      <span class="tagline">At the Church Entrance</span>
      <h3>Garland &amp; Bouquet Presentation</h3>
      <p>Once the church formalities are done, you will head to the church entrance for the welcome. The couple will receive:</p>
      <ul class="bullet-list">
        <li>2 garlands</li>
        <li>2 greeting bouquets</li>
      </ul>

      <div class="friendly-tip">
        <strong>Please Assign Four People in Advance</strong>
        Two people to present the garlands and two to present the bouquets. You may choose younger family members or anyone close to the couple.
      </div>

      <p style="margin-top: 1.25rem;">To keep to the schedule, we recommend limiting photographs at the church to:</p>
      <ul class="bullet-list">
        <li>Clergy</li>
        <li>Immediate family</li>
        <li>Those presenting the garlands and bouquets at the church entrance</li>
      </ul>
      <p style="margin-top: 0.75rem;">Everyone else can join you for photographs at the reception venue.</p>
    </article>

    <\!-- Phase 4: The Reception & Party -->
    <div class="phase-header" id="sec-phase-4">
      <h2>4. The Reception</h2>
    </div>

    <article class="card">
      <span class="tagline">Before You Arrive</span>
      <h3>Keep the Hall Doors Open</h3>
      <p>As guests begin arriving, we strongly recommend keeping the hall doors open so they can walk in, find their seats, and settle in without waiting outside.</p>
      <p style="margin-top: 0.75rem;">Some caterers prefer to keep the doors closed until the couple arrives. Based on our experience, keeping them open makes for a more comfortable experience for guests. The final decision is, of course, entirely yours.</p>
    </article>

    <article class="card">
      <span class="tagline">Getting In</span>
      <h3>Welcoming the Couple &amp; Stage Entry</h3>
      <p>When you arrive at the venue, these family members may gather near the entrance to welcome you:</p>
      <ul class="bullet-list">
        <li>Parents</li>
        <li>Siblings</li>
        <li>Bridesmaids and groomsmen</li>
        <li>Cousins and other close family members</li>
      </ul>
    </article>

    <article class="card">
      <span class="tagline">Moving Into the Hall</span>
      <h3>Stage Entry, Made Quick</h3>
      <p>Once the anchor welcomes the couple, you may start moving into the hall.</p>
      <p style="margin-top: 0.75rem;">To save time, it is a good idea to welcome the couple, parents and siblings onto the stage first, without an introduction. The family introduction can be done after the official functions on stage are over.</p>
    </article>

    <article class="card">
      <span class="tagline">Stage Flow</span>
      <h3>The Stage Programme</h3>
      <p>The order of proceedings may be adjusted according to the priest’s preference. A typical order:</p>
      <ul class="program-steps">
        <li><strong>1. Prayer &amp; Blessing:</strong> The reception generally begins with a prayer and blessing for the newlyweds.</li>
        <li><strong>2. Welcome Drink:</strong> The mothers of the bride and groom receive the glasses first and then present the drinks to the groom and bride. Fizzy apple juice is commonly used.</li>
        <li><strong>3. Candle-Lighting:</strong> Two common traditions. Option 1: the couple lights all three candles together. Option 2: the parents light the two outer candles and the couple lights the centre candle.</li>
        <li><strong>4. Cake Cutting:</strong> A ${A.cake} wedding cake is placed on the cake stand for the cake-cutting ceremony.</li>
        <li><strong>5. Introduction:</strong> The MC will introduce the newlyweds, their parents, and their families.</li>
      </ul>

      <p class="fine-print">The order of candle lighting and cake cutting may be changed according to the priest’s preference.</p>

      <p style="margin-top: 1.1rem; font-size: 0.95rem; color: var(--text-main); font-weight: 500;">
        <em>Our hostesses will be on stage throughout to assist with the drinks, lighter, and cake knife, and to guide everyone smoothly through each of these moments.</em>
      </p>

      <div class="friendly-tip">
        <strong>A Quick Anchor Tip</strong>
        If you are bringing your own MC or anchor, let the priest know beforehand so they can agree on whether the prayer happens at the start or the end of the stage program.
      </div>
    </article>

    <article class="card" id="sec-dress-change">
      <span class="tagline">During the Meal</span>
      <h3>Manthrakodi Dress Change</h3>
      <p>While guests are having their meal, the dress change into the Manthrakodi will take place in the green room of the hall. Please:</p>
      <ul class="bullet-list">
        <li>Keep the outfit easily accessible.</li>
        <li>Make sure the saree drapist is at the hall at the scheduled time.</li>
        <li>Allow enough time to return without delaying photography.</li>
      </ul>
    </article>

    <article class="card">
      <span class="tagline">Stage Photography</span>
      <h3>Photographs With Family &amp; Guests</h3>
      <p>Once you are back from the dress change, stage photography begins.</p>
      <p style="margin-top: 0.75rem;">Our hostess will guide guests to come up on one side of the stage and exit through the other end. Once stage photography is complete, you can finally sit down, relax, and enjoy a meal together with your close family.</p>
    </article>

    <article class="card">
      <span class="tagline">Departure</span>
      <h3>Leaving for the Kacha Ceremony</h3>
      <p>At the end of the reception, the newlyweds will leave for the groom’s home for the traditional Kacha ceremony.</p>
    </article>

    <\!-- Custody of Gifts Reminder -->
    <section class="gentle-reminder" id="sec-reminder">
      <h3>A Little Note on Gifts &amp; Blessings</h3>
      <p>On your big day, so many loved ones will come up to the stage to bless you, bringing gifts, envelopes, jewellery, ornaments, and bouquets with all their love.</p>
      <p style="margin-top: 0.85rem;">Our team will be right beside you, taking care of the stage and keeping everything flowing beautifully. We do ask for your understanding that we are unable to take charge of gifts, valuables, or personal belongings, so that we can give our full attention to your programme.</p>

      <p style="margin-top: 1.1rem; font-weight: 600; color: var(--text-main);">What we gently suggest: ask someone you trust from the family to stand beside the stage and:</p>
      <ul class="bullet-list">
        <li>Collect gifts and envelopes as they come.</li>
        <li>Receive jewellery and other valuables.</li>
        <li>Keep a simple note of what has been received.</li>
        <li>Hand everything safely over to the family once the function is done.</li>
      </ul>

      <p class="fine-print">If needed, items can be kept for a short while behind the sofa or in another spot near the stage, at the family’s own risk. Ivory Events cannot be held responsible for the loss, damage, or misplacement of gifts, valuables, envelopes, jewellery, ornaments, bouquets, or other belongings before, during, or after the event.</p>
    </section>

    <\!-- Warm Signoff Message -->
    <section class="signoff" id="sec-signoff">
      <h2>We’re here to help you enjoy every minute</h2>
      <p>A wedding day can feel busy, but it does not have to be stressful. A little preparation in advance, especially around timings, wedding items, the family members involved in ceremonies, photography, and transportation, helps everything run smoothly.</p>
      <p>Our team will coordinate the arrangements and guide you through the day wherever needed. Your only job is to enjoy the day, spend time with your family and friends, and celebrate this beautiful beginning together.</p>
      <p><em>Wishing ${A.names} a beautiful, joyful, and memorable wedding day!</em></p>
    </section>

    (function initNativeSmoothScroller() {
      const progressBar = document.getElementById('scrollProgress');
      const btnTop = document.getElementById('btnGoTop');
      const btnBottom = document.getElementById('btnGoBottom');

      // Quick Top and Bottom handlers
      btnTop.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      btnBottom.addEventListener('click', () => {
        const footer = document.getElementById('page-footer');
        if (footer) {
          footer.scrollIntoView({ behavior: 'smooth' });
        } else {
          window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
        }
      });

      // Lightweight scroll progress line (read-only, passive, zero touch lock)
      function updateProgress() {
        const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
        if (totalHeight > 0) {
          const progress = Math.min(100, Math.max(0, (window.pageYOffset / totalHeight) * 100));
          progressBar.style.width = progress + '%';
        }
      }

      window.addEventListener('scroll', updateProgress, { passive: true });
    })();
  <\/script>

  // Reads what a quote says (from tlScan) and suggests the editable fields. Nothing here is final - the sheet lets you change it all.
  function tlResolve(scan) {
    var out = { cars: [], cake: 2, church: 'marthoma', notes: [], found: !!scan };
    if (!scan) { out.notes.push('No readable quote for this work, so everything is at its default. Fill in the car and cake details by hand.'); return out; }
    var lines = scan.lines || [];
    var CAR = /^\s*wedding\s*cars?\b(?!\s*decor)/i, DECO = /car\s*decor|decor\w*\s*(?:for\s*)?(?:the\s*)?(?:wedding\s*)?car\b/i;
    var carLines = [], decos = [];
    lines.forEach(function (l) {
      if (CAR.test(l.n)) carLines.push(l);
      else if (DECO.test(l.n)) decos.push(/bride/i.test(l.n) ? 'bride' : (/groom/i.test(l.n) ? 'groom' : ''));
    });

    var cars = [];
    carLines.forEach(function (ci) {
      var who = '', types = [];
      [ci.n.replace(CAR, '')].concat(ci.s || []).forEach(function (p) {
        p = String(p).replace(/^\s*[-–—:]+\s*/, '').replace(/\s*[-–—]?\s*₹.*$/, '').trim();
        if (!p) return;
        var m = /^(?:for\s+)?(?:the\s+)?(bride|groom)(?:’s|'s)?(?:\s+car)?$/i.exec(p);
        if (m) { who = m[1].toLowerCase(); return; }
        var n = 1, mm = /(?:\s+x|\s*×)\s*(\d+)\s*$/i.exec(p);
        if (mm) { n = Math.max(1, Math.min(4, +mm[1])); p = p.slice(0, mm.index); }
        p = p.replace(/\([^)]*\)/g, '').replace(/\s+/g, ' ').trim();
        if (p) types.push({ t: p, n: n });
      });
      if (!types.length) cars.push({ who: who, type: '' });
      types.forEach(function (t) { for (var i = 0; i < t.n; i++) cars.push({ who: who, type: t.t }); });
    });

    // Cars the quote does not label are taken as the groom's. A second unlabeled car is the bride's.
    // Exception: a lone car with a separate "Bride" car decoration line in the quote is taken as the bride's.
    var brideDeco = decos.indexOf('bride') >= 0, groomDeco = decos.some(function (d) { return d !== 'bride'; });
    var haveG = cars.some(function (c) { return c.who === 'groom'; }), guessed = false;
    cars.forEach(function (c) {
      if (c.who) return;
      if (cars.length === 1 && brideDeco) { c.who = 'bride'; return; }
      if (!haveG) { c.who = 'groom'; haveG = true; guessed = cars.length > 1; }
      else { c.who = 'bride'; guessed = true; }
    });
    out.cars = cars.map(function (c) { return { who: c.who, type: c.type, where: '', time: '', deco: c.who === 'bride' ? brideDeco : groomDeco }; });

    if (!cars.length) out.notes.push('No wedding car is listed in the quote, so only the decoration line is used.');
    if (guessed) out.notes.push('The quote does not say which car is whose. Check the Groom / Bride choice below.');
    out.cars.forEach(function (c) {
      if (c.who === 'bride' && !c.deco) out.notes.push('Bride’s car decoration is not in the quote, so the page will not say it is fixed on the car.');
    });

    var cake = 0;
    lines.forEach(function (l) {
      [l.n].concat(l.s || []).forEach(function (tx) {
        if (!/cake/i.test(tx)) return;

      var l = clean((it.querySelector('.info-label') || {}).textContent).toLowerCase();

    };
    Array.prototype.forEach.call(doc.querySelectorAll('.line-item-box'), function (b) {
      if (skipped(b)) return;
      var subs = [];
      Array.prototype.forEach.call(b.querySelectorAll('.line-item-sublist li'), function (li) { subs.push(clean(li.textContent)); });
      lines.push({ n: clean((b.querySelector('.line-item-name') || {}).textContent), s: subs });

    })
      .catch(function (e) {
        $('#vlList').innerHTML = '<div class="note warn">Could not load (' + esc(e.message) + ').<button class="retryb" id="vlRetry">Try again</button></div>';
      })
      .then(function () { busy(false); });
  }
  function vlPrune() {
    var past = $('#vlPast').checked, have = {};
    VL.forEach(function (r) { have[r.id + '|' + r.date] = 1; });
    var works = items.filter(function (i) { return i.status === 'Confirmed' && have[wkey(i)] && (past || !i.date || i.date >= today); });
    if (!works.length) return Promise.resolve(0);
    return Promise.all(works.map(function (it) {
      return ghQuotes(it, true).then(function (qs) { return { it: it, qs: qs }; }, function () { return null; });
    })).then(function (res) {
      var removed = 0, chain = Promise.resolve();
      res.forEach(function (x) {
        if (!x || !x.qs.length) return;
        var latest = x.qs.slice().sort(function (a, b) { return b.no.localeCompare(a.no); })[0];
        if (!latest || !latest.text) return;
        var it = x.it, allowed = quoteVendors(latest);
        var gone = VL.filter(function (r) { return r.id === it.id && r.date === it.date && allowed.indexOf(r.vendor) < 0; }).map(function (r) { return r.vendor; });
        if (!gone.length) return;
        VL = VL.filter(function (r) { return !(r.id === it.id && r.date === it.date && gone.indexOf(r.vendor) >= 0); });
        removed += gone.length;
        chain = chain.then(function () { return removeVendors(it, gone); });
      });
      return chain.then(function () { return removed; });
    });
  }
  // Message for one vendor: "Date: venue" then each item name followed by its Details exactly as typed. No client name, no greeting.
  function waLink(g) {
    var blocks = [], idx = {};
    g.items.forEach(function (r) {
      var head = fmt(r.date) + ((r.venue || '').trim() ? ': ' + r.venue.trim() : '');
      var line = r.vendor + ((r.details || '').trim() ? ' - ' + r.details.trim() : '');   // item name + Details exactly as typed
      if (idx[head] === undefined) { idx[head] = blocks.length; blocks.push([head]); }
      blocks[idx[head]].push(line);
    });
    var text = blocks.map(function (b) { return b.join('\n'); }).join('\n\n');
    return 'https://wa.me/?text=' + encodeURIComponent(text);
  }
  function renderVL() {
    var una = vlView === 'una';
    $('#vlSeg').style.display = una ? 'none' : '';
    $('#vlMeta').textContent = una ? 'Every outside-vendor item that has no vendor name yet' : 'Each vendor, the dates and what is booked';
    Array.prototype.forEach.call(document.querySelectorAll('#vlView .vchip'), function (x) {
      x.classList.toggle('on', x.getAttribute('data-view') === vlView);
    });
    if (una) { renderUna(); return; }
    unaTok++;
    var past = $('#vlPast').checked, ql = ($('#vlQ').value || '').trim().toLowerCase();
    var groups = {}, order = [], unnamed = 0;
    VL.forEach(function (r) {
      var nm = (r.supplier || '').trim();
      if (!past && r.date && r.date < today) return;
      if (!nm) { if (r.booked || (r.details || '').trim()) unnamed++; return; }
      if (vlF === 'Booked' && !r.booked) return;
      if (vlF === 'Not booked' && r.booked) return;
      if (ql && (nm + ' ' + r.client + ' ' + r.vendor + ' ' + r.details + ' ' + r.venue).toLowerCase().indexOf(ql) < 0) return;
      var k = nm.toLowerCase();
      if (!groups[k]) { groups[k] = { name: nm, items: [] }; order.push(k); }
      groups[k].items.push(r);
    });
    order.sort();
    var h = order.map(function (k) {
      var g = groups[k];
      g.items.sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });
      return '<div class="vg"><h4>' + esc(g.name) + '<span>' + g.items.length + (g.items.length === 1 ? ' booking' : ' bookings') + '</span></h4>' +
        g.items.map(function (r) {
          return '<div class="vi"><div><span class="d">' + fmt(r.date) + '</span> &middot; ' + esc(r.client) +
            '</div>' +
            '<label class="vtk' + (r.booked ? ' on' : '') + '"><input type="checkbox" class="vbk" data-id="' + esc(r.id) + '" data-date="' + esc(r.date) + '" data-v="' + esc(r.vendor) + '"' + (r.booked ? ' checked' : '') + '><span>' + (r.booked ? 'Booked' : 'Mark as booked') + '</span></label>' +
            ((r.venue || '').trim() ? '<div class="vv">Venue: ' + esc(r.venue) + '</div>' : '') +
            '<div class="w">' + esc(r.vendor) + ((r.details || '').trim() ? ' <i>&mdash;</i> ' + esc(r.details) : '') + '</div></div>';
        }).join('') +
        '<a class="wa" href="' + esc(waLink(g)) + '" target="_blank" rel="noopener">Share on WhatsApp</a></div>';
    }).join('');
    if (!h) h = '<div class="note">' + (VL.length ? 'Nothing matches.' : 'No vendors entered yet. Type a vendor name in an outside vendor box and it will show here.') + '</div>';
    if (unnamed) h += '<div class="note">' + unnamed + (unnamed === 1 ? ' entry has' : ' entries have') + ' no vendor name yet, so ' + (unnamed === 1 ? 'it is' : 'they are') + ' not listed here.</div>';
    $('#vlList').innerHTML = h;
  }

  /* ---------- Vendor list > Not assigned: all outside-vendor items without a vendor name, across every confirmed work ---------- */
  // Outside-vendor items a quote asks for: the 12 standard vendors found in its wording, plus anything under its "Outside Vendors" heading.
  // Decor package items are never included.
  function quoteVendors(latest) {
    var out = [];
    if (!latest || !latest.text) return out;
    VNAMES.forEach(function (n) { if (vHit(n, latest)) out.push(n); });
    (latest.outside || []).forEach(function (o) {
      var known = VNAMES.some(function (n) { return stdMatch(n, o); });
      if (!known && out.indexOf(o) < 0) out.push(o);
    });
    return out;
  }
  function unaCompute() {
    var tok = ++unaTok, past = $('#vlPast').checked;
    var works = items.filter(function (i) { return i.status === 'Confirmed' && (past || !i.date || i.date >= today); });
    works.sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });
    $('#vlList').innerHTML = '<div class="note">Checking the quotes of ' + works.length + ' confirmed works...</div>';
    return Promise.all(works.map(function (it) {
      return ghQuotes(it, true).then(function (qs) { return { it: it, qs: qs }; }, function () { return { it: it, qs: [], err: true }; });
    })).then(function (res) {
      if (tok !== unaTok) return;
      var named = {}, saved = {};
      VL.forEach(function (r) {
        var k = r.id + '|' + r.date + '|' + r.vendor;
        saved[k] = r;
        if ((r.supplier || '').trim()) named[k] = 1;
      });
      var groups = [], unreadable = [], failed = false;
      res.forEach(function (x) {
        var it = x.it, base = it.id + '|' + it.date + '|';
        var qs = x.qs.slice().sort(function (a, b) { return b.no.localeCompare(a.no); });   // latest quote first
        var names = quoteVendors(qs[0]);
        if (x.err) failed = true;
        if (!qs.length && !names.length) { unreadable.push(it.name); return; }
        var lines = names.filter(function (n) {
          var k = base + n, s = saved[k];
          if (named[k]) return false;                                      // already has a vendor name
          if (s && /included\s+in\s+package/i.test(s.details || '')) return false;   // supplied inside the package
          return true;
        });
        if (lines.length) groups.push({ it: it, lines: lines, saved: saved, base: base });
      });
      UNA = { groups: groups, unreadable: unreadable, failed: failed };
      renderUna();
    }).catch(function (e) {
      if (tok !== unaTok) return;
      $('#vlList').innerHTML = '<div class="note warn">Could not check the quotes (' + esc(e.message) + ').<button class="retryb" id="vlRetry">Try again</button></div>';
    });
  }
  var UNA = null;
  function renderUna() {
    if (!UNA) { unaCompute(); return; }
    var ql = ($('#vlQ').value || '').trim().toLowerCase(), total = 0, h = '';
    UNA.groups.forEach(function (g) {
      var it = g.it;
      if (ql && (it.name + ' ' + it.venue + ' ' + g.lines.join(' ')).toLowerCase().indexOf(ql) < 0) return;
      total += g.lines.length;
      h += '<div class="vg"><h4>' + esc(it.name) + '<span>' + fmt(it.date) + '</span></h4>' +
        (it.venue ? '<div class="vv" style="font-size:13px;color:var(--muted);margin-bottom:2px">' + esc(it.venue) + '</div>' : '') +
        g.lines.map(function (n) {
          var s = g.saved[g.base + n], det = s && (s.details || '').trim();
          return '<div class="una" data-row="' + it.row + '" data-id="' + esc(it.id) + '" data-date="' + esc(it.date) + '" data-v="' + esc(n) + '">' +
            '<div class="un">' + esc(n) + (det ? '<div class="ud">' + esc(det) + '</div>' : '') + '</div>' +
            '<input class="uname" list="unaSup" autocomplete="off" placeholder="Vendor name" aria-label="' + esc(n) + ' - vendor name"></div>';
        }).join('') + '</div>';
    });
    var sup = {}, supList = [];
    VL.forEach(function (r) { var s = (r.supplier || '').trim(); if (s && !sup[s.toLowerCase()]) { sup[s.toLowerCase()] = 1; supList.push(s); } });
    supList.sort(function (a, b) { return a.toLowerCase().localeCompare(b.toLowerCase()); });
    var head = '<div class="note"><b>' + total + '</b> outside-vendor ' + (total === 1 ? 'item has' : 'items have') + ' no vendor name yet. Type the name next to an item and it saves straight away.</div>';
    if (!total) head = '<div class="note">' + (UNA.groups.length ? 'Nothing matches.' : 'Every outside vendor has a name. Nothing left to assign.') + '</div>';
    h = head + h + '<datalist id="unaSup">' + supList.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>';
    if (UNA.unreadable.length) h += '<div class="note warn">No readable quote for ' + esc(UNA.unreadable.join(', ')) + ', so their vendors are not listed. Open the work to check.</div>';
    if (UNA.failed) h += '<div class="note warn">Some quotes could not be loaded just now.<button class="retryb" id="vlRetry">Try again</button></div>';
    $('#vlList').innerHTML = h;
  }
  $('#vlList').addEventListener('change', function (e) {
    var inp = e.target.closest('.uname'); if (!inp) return;
    var row = inp.closest('.una'), val = inp.value.trim(); if (!val) return;
    var d = { row: +row.getAttribute('data-row'), id: row.getAttribute('data-id'), date: row.getAttribute('data-date'), vendor: row.getAttribute('data-v') };
    busy(true);
    call('api_vendor', pin, { row: d.row, id: d.id, date: d.date, vendor: d.vendor, fields: { supplier: val } })
      .then(function () {
        row.classList.add('done');
        var hit = VL.filter(function (r) { return r.id === d.id && r.date === d.date && r.vendor === d.vendor; })[0];
        if (hit) hit.supplier = val;
        else {
          var it = items.filter(function (i) { return i.row === d.row; })[0] || {};
          VL.push({ id: d.id, date: d.date, client: it.name || '', venue: it.venue || '', vendor: d.vendor, details: '', supplier: val, booked: false });
        }
      })
      .catch(function (err) { toast('Not saved: ' + err.message, true); })
      .then(function () { busy(false); });
  });

  // tick "Booked" straight from the By vendor list
  $('#vlList').addEventListener('change', function (e) {
    var cb = e.target.closest('.vbk'); if (!cb) return;
    var id = cb.getAttribute('data-id'), date = cb.getAttribute('data-date'), vendor = cb.getAttribute('data-v'), on = cb.checked;
    var it = items.filter(function (i) { return i.id === id && i.date === date; })[0];
    var lab = cb.closest('.vtk');
    if (!it) { cb.checked = !on; toast('Could not find this work. Refresh and try again.', true); return; }
    lab.classList.toggle('on', on); lab.querySelector('span').textContent = on ? 'Booked' : 'Mark as booked';
    busy(true);
    call('api_vendor', pin, { row: it.row, id: id, date: date, vendor: vendor, fields: { booked: on } })
      .then(function () {
        VL.forEach(function (r) { if (r.id === id && r.date === date && r.vendor === vendor) r.booked = on; });
      })
      .catch(function (err) {
        cb.checked = !on; lab.classList.toggle('on', !on); lab.querySelector('span').textContent = !on ? 'Booked' : 'Mark as booked';
        toast('Not saved: ' + err.message, true);
      })
      .then(function () { busy(false); });
  });

  $('#vlist').addEventListener('click', function () { UNA = null; openVL(); });
  $('#vlClose').addEventListener('click', closeSheets);
  $('#vlView').addEventListener('click', function (e) {
    var b = e.target.closest('.vchip'); if (!b) return;
    vlView = b.getAttribute('data-view');
    if (vlView === 'una') UNA = null;   // recheck so names just entered are reflected
    renderVL();
  });
  $('#vlSeg').addEventListener('click', function (e) {
    var b = e.target.closest('.vchip'); if (!b) return;
    vlF = b.getAttribute('data-b');
    Array.prototype.forEach.call(document.querySelectorAll('#vlSeg .vchip'), function (x) { x.classList.toggle('on', x === b); });
    renderVL();
  });
  $('#vlPast').addEventListener('change', function () { UNA = null; renderVL(); });
  $('#vlQ').addEventListener('input', renderVL);
  $('#vlList').addEventListener('click', function (e) { if (e.target.id === 'vlRetry') { UNA = null; if (vlView === 'una') renderVL(); else openVL(); } });

  // keep both phones current
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(true); });
  setInterval(function () { if (!document.hidden && !document.querySelector('.sheet.show')) load(true); }, 60000);

  load();
})();
</script>
</body>
